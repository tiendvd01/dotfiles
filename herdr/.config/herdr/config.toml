# herdr configuration
# Place this file at ~/.config/herdr/config.toml

onboarding = false

[theme]
# Built-in themes: catppuccin, terminal, tokyo-night, dracula, nord,
#                  gruvbox, one-dark, solarized, kanagawa, rose-pine,
#                  vesper
name = "dracula"
auto_switch = false

[keys]
# Navigate pane tiện hơn
focus_pane_left = ["prefix+h"]
focus_pane_down = ["prefix+j"]
focus_pane_up = ["prefix+k"]
focus_pane_right = ["prefix+l"]

# Navigate workspace
navigate_workspace_down = ["j", "down"]
navigate_workspace_up = ["k", "up"]

# Worktree — cặp với new_worktree (prefix+shift+g)
open_worktree   = "prefix+shift+o"
remove_worktree = "prefix+ctrl+g"

# Điều hướng workspace tuần tự (khác với workspace_picker = prefix+w)
previous_workspace = "prefix+{"
next_workspace      = "prefix+}"

# Điều hướng agent tuần tự trong sidebar
previous_agent = "prefix+,"
next_agent     = "prefix+."

# Sắp xếp lại vị trí tab, cặp với previous_tab/next_tab (p/n)
move_tab_previous = "prefix+ctrl+p"
move_tab_next     = "prefix+ctrl+n"

# Quay lại pane vừa focus trước đó (kiểu tmux "prefix+;")
last_pane = "prefix+;"

# Resize trực tiếp không cần vào resize_mode — dùng chord an toàn ctrl+alt
resize_pane_left  = "ctrl+alt+shift+h"
resize_pane_down  = "ctrl+alt+shift+j"
resize_pane_up    = "ctrl+alt+shift+k"
resize_pane_right = "ctrl+alt+shift+l"

# Nhảy thẳng tới agent theo số 1-9, không cần prefix
[keys.indexed]
agents     = "ctrl+alt"        # ctrl+alt+1..9 → focus agent 1..9
workspaces = "ctrl+alt+shift"  # ctrl+alt+shift+1..9 → switch_workspace 1..9

[[keys.command]]
key = "alt+e"
type = "popup"
command = "hunk diff"
width = "90%"
height = "90%"

# herdr-worktrunk plugin (wt) — prefix+alt để không đụng worktree gốc của herdr
[[keys.command]]
key = "prefix+alt+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

[[keys.command]]
key = "prefix+alt+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch / create from current branch"

[[keys.command]]
key = "prefix+alt+m"
type = "plugin_action"
command = "worktrunk.merge"
description = "Worktree: merge into the target branch"

[[keys.command]]
key = "prefix+alt+x"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

[experimental]
pane_history = false
allow_nested = true

[ui]
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false

[ui.toast]
delivery = "terminal"

[worktrees]
directory = "~/Documents/SoraTech/.herdr/worktrees"
